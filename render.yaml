services:
  # ──────────────────────────────────────────────
  # 1. NestJS Backend API Service
  # ──────────────────────────────────────────────
  - type: web
    name: gcs-api
    runtime: node
    plan: starter
    rootDir: apps/api
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: gcs-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: gcs-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: gcs-web
          property: host

  # ──────────────────────────────────────────────
  # 2. Next.js Frontend Web Application
  # ──────────────────────────────────────────────
  - type: web
    name: gcs-web
    runtime: node
    plan: starter
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: gcs-api
          property: host

databases:
  # ──────────────────────────────────────────────
  # 3. Managed PostgreSQL Database
  # ──────────────────────────────────────────────
  - name: gcs-postgres
    databaseName: immigration_db
    user: gcs_admin
    plan: starter

  # ──────────────────────────────────────────────
  # 4. Managed Redis Cache
  # ──────────────────────────────────────────────
  - name: gcs-redis
    plan: starter
    ipAllowList: []

