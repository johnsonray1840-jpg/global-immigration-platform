name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify lock files exist
        run: |
          ls -la apps/api/package-lock.json
          ls -la apps/web/package-lock.json

      - name: Install backend dependencies
        working-directory: apps/api
        run: npm ci

      - name: Run backend tests
        working-directory: apps/api
        run: npm test

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build frontend
        working-directory: apps/web
        run: npm run build
