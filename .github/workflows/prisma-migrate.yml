name: Prisma Migrations & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-migrations:
    name: Test Prisma Migrations
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: immigration
          POSTGRES_PASSWORD: immigration
          POSTGRES_DB: immigration_db_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json
      
      - name: Install dependencies
        working-directory: ./apps/api
        run: npm ci
      
      - name: Run Prisma migrations (test)
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql://immigration:immigration@localhost:5432/immigration_db_test?schema=public
        run: npx prisma migrate deploy
      
      - name: Generate Prisma Client
        working-directory: ./apps/api
        run: npx prisma generate
      
      - name: Validate schema
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql://immigration:immigration@localhost:5432/immigration_db_test?schema=public
        run: npx prisma validate
      
      - name: Run tests
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql://immigration:immigration@localhost:5432/immigration_db_test?schema=public
        run: npm test || echo "No tests found or tests failed"

  deploy-production:
    name: Deploy to Production
    needs: test-migrations
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json
      
      - name: Install dependencies
        working-directory: ./apps/api
        run: npm ci
      
      - name: Run Prisma migrations (production)
        working-directory: ./apps/api
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx prisma migrate deploy
      
      - name: Generate Prisma Client
        working-directory: ./apps/api
        run: npx prisma generate
      
      - name: Build application
        working-directory: ./apps/api
        run: npm run build
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            docker compose up -d
            echo "Deployment completed successfully!"
